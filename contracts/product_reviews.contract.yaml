dataContractSpecification: 1.1.0
id: urn:datacontract:retail-etl:product-reviews
info:
  title: Product Reviews
  version: 1.0.0
  description: >
    One row per customer review, normalized out of the source API's nested
    `reviews[]` field and linked to a product.
  owner: etl-csv-excel-data
  status: active
servers:
  output:
    type: local
    path: data/output/product_reviews.csv
    format: csv
    delimiter: ","
models:
  product_reviews:
    description: One row per review.
    type: table
    fields:
      review_id:
        type: integer
        required: true
        unique: true
        primaryKey: true
        description: Surrogate key generated during Transform — the source has no natural review identifier.
      product_id:
        type: integer
        required: true
        references: products.product_id
      rating:
        type: integer
        minimum: 1
        maximum: 5
      comment:
        type: string
      review_date:
        type: timestamp
      reviewer_name:
        type: string
        description: >
          Synthetic data generated by the source API — not a real person.
          See docs/data-dictionary.md.
      reviewer_email:
        type: string
        description: >
          Synthetic data generated by the source API (`@x.dummyjson.com`
          domain) — not real PII. See docs/data-dictionary.md.
quality:
  - type: text
    description: review_id must be non-null and unique within the table.
  - type: text
    description: product_id must reference an existing row in products.product_id.
tags:
  - retail
  - reviews
